name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Patch RNTP native remote handlers (native fallback)
        run: python3 patch_rntp.py

      - name: Generate native iOS project (prebuild)
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..
          python3 patch_rntp.py

      - name: Detect Xcode scheme
        id: scheme
        run: |
          SCHEME=$(xcodebuild -list -workspace ios/*.xcworkspace 2>/dev/null | sed -n '/Schemes:/,$p' | sed -n '2p' | xargs)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Verify RNTP native patch landed in Pods (compiled source)
        run: |
          set -e
          echo "=== Pods top-level ==="
          ls ios/Pods 2>/dev/null | head -80
          echo "=== any RNTrackPlayer.swift anywhere under ios ==="
          find ios -name "RNTrackPlayer.swift" 2>/dev/null | head
          echo "=== any .swift under ios mentioning handlePlayCommand ==="
          grep -rl "handlePlayCommand" ios --include=*.swift 2>/dev/null | head
          echo "=== find RNTP framework under ios ==="
          find ios -iname "*trackplayer*.framework" 2>/dev/null | head
          F=$(find ios -name "RNTrackPlayer.swift" 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "!! RNTrackPlayer.swift not found under ios — RNTP not present as plain source (prebuilt/linked?)"
            exit 1
          fi
          echo "RNTP source that will be compiled: $F"
          if grep -q "self?.player.next()" "$F" && grep -q "self?.player.pause()" "$F" && grep -q "self?.player.seek(to: event.positionTime)" "$F"; then
            echo "✅ RNTP native lock-screen fallback patch confirmed in compiled Pods source"
          else
            echo "!! RNTP native patch MISSING in Pods source — aborting build (would ship broken lock screen)"
            exit 1
          fi

      - name: Archive (unsigned, device target)
        run: |
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry App-unsigned.ipa Payload
          ls -lh App-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: App-unsigned.ipa
          retention-days: 30
